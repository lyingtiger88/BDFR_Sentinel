name: Windows Minifilter Driver

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "drivers/minifilter/**"
      - "scripts/Build-Minifilter.ps1"
      - ".github/workflows/windows-driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          nuget restore drivers\minifilter\packages.config -PackagesDirectory drivers\minifilter\packages -NonInteractive

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installation) {
            throw "Visual Studio/MSBuild installation not found"
          }
          $path = Join-Path $installation "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $path)) {
            throw "MSBuild.exe not found at $path"
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build x64 Release minifilter
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" drivers\minifilter\BDFRSentinelFilter.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Collect unsigned driver package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path driver-dist | Out-Null
          $sys = Get-ChildItem drivers\minifilter -Filter BDFRSentinelFilter.sys -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $sys) { throw "BDFRSentinelFilter.sys was not produced" }
          Copy-Item $sys.FullName driver-dist\BDFRSentinelFilter.sys
          Copy-Item drivers\minifilter\BDFRSentinelFilter.inf driver-dist\BDFRSentinelFilter.inf
          Copy-Item drivers\minifilter\README.md driver-dist\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Minifilter-Unsigned-x64
          path: driver-dist
          if-no-files-found: error
