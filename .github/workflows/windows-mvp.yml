name: Windows MVP Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "test-builds/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release executables
        run: cargo build --release -p bdfr-sentinel -p bdfr-sentinel-gui -p bdfr-sentinel-service

      - name: CLI smoke test
        run: target\release\bdfr-sentinel.exe status

      - name: Protection engine self-test
        shell: pwsh
        run: |
          target\release\bdfr-sentinel-service.exe self-test

      - name: Protection service lifecycle smoke test
        shell: pwsh
        run: |
          $service = Resolve-Path target\release\bdfr-sentinel-service.exe
          & $service install
          if ($LASTEXITCODE -ne 0) { throw "Service install failed" }

          $failurePolicy = (sc.exe qfailure BDFRSentinel | Out-String)
          if ($failurePolicy -notmatch "RESTART") {
            & $service uninstall 2>$null
            throw "Service recovery policy was not configured"
          }

          & $service start
          if ($LASTEXITCODE -ne 0) { throw "Service start request failed" }

          $running = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $state = (& $service status 2>&1 | Out-String).Trim()
            if ($state -match "Running") {
              $running = $true
              break
            }
          }

          if (-not $running) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Protection service did not reach Running state"
          }

          & $service stop
          Start-Sleep -Seconds 1
          & $service uninstall

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\bdfr-sentinel.exe dist\bdfr-sentinel.exe
          Copy-Item target\release\bdfr-sentinel-gui.exe dist\bdfr-sentinel-gui.exe
          Copy-Item target\release\bdfr-sentinel-service.exe dist\bdfr-sentinel-service.exe
          Copy-Item README.md dist\README.md
          if (Test-Path docs\MVP.md) { Copy-Item docs\MVP.md dist\MVP.md }
          if (Test-Path scripts\Install-Protection.ps1) { Copy-Item scripts\Install-Protection.ps1 dist\Install-Protection.ps1 }
          if (Test-Path scripts\Uninstall-Protection.ps1) { Copy-Item scripts\Uninstall-Protection.ps1 dist\Uninstall-Protection.ps1 }
          if (Test-Path scripts\Build-Minifilter.ps1) { Copy-Item scripts\Build-Minifilter.ps1 dist\Build-Minifilter.ps1 }
          if (Test-Path drivers\minifilter) { Copy-Item drivers\minifilter dist\minifilter -Recurse }
          Compress-Archive -Path dist\* -DestinationPath BDFR-Sentinel-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Windows-x64
          path: BDFR-Sentinel-Windows-x64.zip
          if-no-files-found: error

      - name: Publish test build into repository
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-builds | Out-Null
          Copy-Item BDFR-Sentinel-Windows-x64.zip test-builds\BDFR-Sentinel-Windows-x64.zip -Force

          @"
          # BDFR Sentinel Test Builds

          Latest Windows x64 test package:

          - `BDFR-Sentinel-Windows-x64.zip`
          - Contains `bdfr-sentinel.exe`, `bdfr-sentinel-gui.exe`, and `bdfr-sentinel-service.exe`
          - Generated automatically after a successful Windows release build and smoke test.

          These packages are test builds, not production releases.
          "@ | Set-Content test-builds\README.md -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-builds
          if (git diff --cached --quiet) {
            Write-Host "No test build changes to publish."
            exit 0
          }
          git commit -m "Publish latest Windows test build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
