name: Windows MVP Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "test-builds/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release executables
        run: cargo build --release -p bdfr-sentinel -p bdfr-sentinel-gui -p bdfr-sentinel-service

      - name: CLI smoke test
        run: target\release\bdfr-sentinel.exe status

      - name: Scanner performance smoke test
        run: target\release\bdfr-sentinel.exe perf-smoke --size-mb 8 --iterations 2

      - name: Protection engine self-test
        shell: pwsh
        run: |
          target\release\bdfr-sentinel-service.exe self-test

      - name: Protection service lifecycle smoke test
        shell: pwsh
        run: |
          $service = Resolve-Path target\release\bdfr-sentinel-service.exe
          & $service install
          if ($LASTEXITCODE -ne 0) { throw "Service install failed" }

          $failurePolicy = (sc.exe qfailure BDFRSentinel | Out-String)
          if ($failurePolicy -notmatch "RESTART") {
            & $service uninstall 2>$null
            throw "Service recovery policy was not configured"
          }

          $sidType = (sc.exe qsidtype BDFRSentinel | Out-String)
          if ($sidType -notmatch "UNRESTRICTED") {
            & $service uninstall 2>$null
            throw "Service SID hardening was not configured"
          }

          $serviceAcl = (sc.exe sdshow BDFRSentinel | Out-String)
          if ($serviceAcl -notmatch ";;;SY\)" -or $serviceAcl -notmatch ";;;BA\)") {
            & $service uninstall 2>$null
            throw "Service ACL hardening was not configured"
          }

          & $service start
          if ($LASTEXITCODE -ne 0) { throw "Service start request failed" }

          $running = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $state = (& $service status 2>&1 | Out-String).Trim()
            if ($state -match "Running") {
              $running = $true
              break
            }
          }

          if (-not $running) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Protection service did not reach Running state"
          }

          $statusPath = Join-Path $env:ProgramData "BDFR\Sentinel\status.json"
          $firewallActive = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 250
            if (Test-Path $statusPath) {
              try {
                $snapshot = Get-Content $statusPath -Raw | ConvertFrom-Json
                if ([bool]$snapshot.network_protection_active -and $snapshot.firewall_mode -eq "smart") {
                  $firewallActive = $true
                  break
                }
              } catch {}
            }
          }
          if (-not $firewallActive) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "WFP kernel firewall did not activate"
          }

          & $service config apply-restart realtime_file_monitor=false
          if ($LASTEXITCODE -ne 0) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Could not disable real-time file monitor"
          }

          $realtimeOff = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $statusPath) {
              try {
                $snapshot = Get-Content $statusPath -Raw | ConvertFrom-Json
                if ($snapshot.protection -eq "running" -and -not [bool]$snapshot.realtime_file_monitor) {
                  $realtimeOff = $true
                  break
                }
              } catch {}
            }
          }
          if (-not $realtimeOff) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Real-time protection status did not transition to OFF"
          }

          & $service config apply-restart realtime_file_monitor=true
          if ($LASTEXITCODE -ne 0) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Could not re-enable real-time file monitor"
          }

          $realtimeOn = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $statusPath) {
              try {
                $snapshot = Get-Content $statusPath -Raw | ConvertFrom-Json
                if ($snapshot.protection -eq "running" -and [bool]$snapshot.realtime_file_monitor) {
                  $realtimeOn = $true
                  break
                }
              } catch {}
            }
          }
          if (-not $realtimeOn) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Real-time protection status did not transition back to ON"
          }

          $before = Get-CimInstance Win32_Service -Filter "Name='BDFRSentinel'"
          $oldPid = [int]$before.ProcessId
          if ($oldPid -le 0) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Could not resolve protection service PID"
          }

          taskkill.exe /PID $oldPid /F | Out-Null

          $recovered = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $current = Get-CimInstance Win32_Service -Filter "Name='BDFRSentinel'"
            if ($current.State -eq "Running" -and [int]$current.ProcessId -gt 0 -and [int]$current.ProcessId -ne $oldPid) {
              $recovered = $true
              break
            }
          }

          if (-not $recovered) {
            & $service stop 2>$null
            & $service uninstall 2>$null
            throw "Protection service did not recover after forced process termination"
          }

          & $service stop
          Start-Sleep -Seconds 1
          & $service uninstall

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build standalone installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "installer\BDFR-Sentinel.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path "installer\output\BDFR-Sentinel-Setup-x64.exe")) {
            throw "Installer output was not generated"
          }

      - name: Standalone installer smoke test
        shell: pwsh
        run: |
          $setup = Resolve-Path "installer\output\BDFR-Sentinel-Setup-x64.exe"
          $installLog = Join-Path $env:RUNNER_TEMP "bdfr-sentinel-install.log"

          sc.exe stop BDFRSentinel 2>$null | Out-Null
          sc.exe delete BDFRSentinel 2>$null | Out-Null
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Get-Service -Name BDFRSentinel -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 250
          }

          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="$installLog"
          $setupExit = $LASTEXITCODE
          if ($setupExit -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog | Write-Host }
            throw "Silent installer failed with exit code $setupExit"
          }

          $installDir = Join-Path $env:ProgramFiles "BDFR Sentinel"
          $gui = Join-Path $installDir "bdfr-sentinel-gui.exe"
          $serviceExe = Join-Path $installDir "bdfr-sentinel-service.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"

          if (-not (Test-Path $gui)) { throw "Installed GUI was not found" }
          if (-not (Test-Path $serviceExe)) { throw "Installed service binary was not found" }
          if (-not (Test-Path $uninstaller)) { throw "Windows uninstaller was not registered" }

          $running = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $svc = Get-Service -Name BDFRSentinel -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq "Running") {
              $running = $true
              break
            }
          }
          if (-not $running) { throw "Installed protection service did not reach Running state" }

          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed" }

          Start-Sleep -Seconds 2
          if (Get-Service -Name BDFRSentinel -ErrorAction SilentlyContinue) {
            throw "Protection service still exists after uninstall"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\bdfr-sentinel.exe dist\bdfr-sentinel.exe
          Copy-Item target\release\bdfr-sentinel-gui.exe dist\bdfr-sentinel-gui.exe
          Copy-Item target\release\bdfr-sentinel-service.exe dist\bdfr-sentinel-service.exe
          Copy-Item README.md dist\README.md
          if (Test-Path docs\MVP.md) { Copy-Item docs\MVP.md dist\MVP.md }
          if (Test-Path Definitions) { Copy-Item Definitions dist\Definitions -Recurse }
          if (Test-Path scripts\Install-Protection.ps1) { Copy-Item scripts\Install-Protection.ps1 dist\Install-Protection.ps1 }
          if (Test-Path scripts\Uninstall-Protection.ps1) { Copy-Item scripts\Uninstall-Protection.ps1 dist\Uninstall-Protection.ps1 }
          if (Test-Path scripts\Build-Minifilter.ps1) { Copy-Item scripts\Build-Minifilter.ps1 dist\Build-Minifilter.ps1 }
          if (Test-Path drivers\minifilter) { Copy-Item drivers\minifilter dist\minifilter -Recurse }
          if (Test-Path test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip) {
            Copy-Item test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip dist\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip
          }
          Compress-Archive -Path dist\* -DestinationPath BDFR-Sentinel-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Windows-x64
          path: |
            BDFR-Sentinel-Windows-x64.zip
            installer/output/BDFR-Sentinel-Setup-x64.exe
          if-no-files-found: error

      - name: Publish test build into repository
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-builds | Out-Null
          Copy-Item BDFR-Sentinel-Windows-x64.zip test-builds\BDFR-Sentinel-Windows-x64.zip -Force
          Copy-Item installer\output\BDFR-Sentinel-Setup-x64.exe test-builds\BDFR-Sentinel-Setup-x64.exe -Force

          @"
          # BDFR Sentinel Test Builds

          Latest Windows x64 test package:

          - `BDFR-Sentinel-Setup-x64.exe` — standalone Windows installer
          - `BDFR-Sentinel-Windows-x64.zip` — portable/test package
          - Installer includes GUI, CLI, protection service, definitions, Start Menu integration and Windows uninstaller.
          - Generated automatically after successful build, protection tests, installer install test and uninstall test.

          These packages are test builds, not production releases.
          "@ | Set-Content test-builds\README.md -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-builds
          if (git diff --cached --quiet) {
            Write-Host "No test build changes to publish."
            exit 0
          }
          git commit -m "Publish latest Windows test build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
