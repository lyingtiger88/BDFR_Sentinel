name: Minifilter Driver

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "drivers/minifilter/**"
      - ".github/workflows/minifilter-driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore pinned WDK and SDK packages
        shell: pwsh
        run: |
          nuget restore drivers\minifilter\packages.config `
            -PackagesDirectory drivers\minifilter\packages `
            -NonInteractive

      - name: Locate MSBuild
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }

          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio with MSBuild not found" }

          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found at $msbuild" }

          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build x64 minifilter
        shell: pwsh
        run: |
          & '${{ steps.tools.outputs.msbuild }}' `
            drivers\minifilter\BDFRSentinelFilter.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package driver
        shell: pwsh
        run: |
          $sys = Get-ChildItem drivers\minifilter -Filter BDFRSentinelFilter.sys -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $sys) { throw "BDFRSentinelFilter.sys was not produced" }

          Write-Host "Driver built: $($sys.FullName)"
          New-Item -ItemType Directory -Force driver-dist | Out-Null
          Copy-Item $sys.FullName driver-dist\BDFRSentinelFilter.sys
          Copy-Item drivers\minifilter\BDFRSentinelFilter.inf driver-dist\BDFRSentinelFilter.inf
          Copy-Item drivers\minifilter\README.md driver-dist\README.md
          Compress-Archive driver-dist\* BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Minifilter-x64-UNSIGNED
          path: BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip
          if-no-files-found: error

      - name: Publish unsigned driver test build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-builds | Out-Null
          Copy-Item BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip

          if (git diff --cached --quiet) {
            Write-Host "No driver test build changes to publish."
            exit 0
          }

          git commit -m "Publish latest unsigned minifilter test build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main