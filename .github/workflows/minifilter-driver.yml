name: Minifilter Driver

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "drivers/minifilter/**"
      - ".github/workflows/minifilter-driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore pinned WDK and SDK packages
        shell: pwsh
        run: |
          nuget restore drivers\minifilter\packages.config `
            -PackagesDirectory drivers\minifilter\packages `
            -NonInteractive

      - name: Locate compiler and WDK assets
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }

          $cl = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter cl.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\cl.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $cl) { throw "x64 cl.exe not found" }

          $link = Join-Path $cl.Directory.FullName "link.exe"
          if (-not (Test-Path $link)) { throw "link.exe not found" }

          $msvcRoot = $cl.Directory.Parent.Parent.Parent.FullName
          $msvcInclude = Join-Path $msvcRoot "include"

          $packages = (Resolve-Path drivers\minifilter\packages).Path
          $fltKernel = Get-ChildItem $packages -Recurse -Filter fltKernel.h | Select-Object -First 1
          $ntdef = Get-ChildItem $packages -Recurse -Filter ntdef.h | Select-Object -First 1
          $fltMgr = Get-ChildItem $packages -Recurse -Filter FltMgr.lib | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $ntoskrnl = Get-ChildItem $packages -Recurse -Filter ntoskrnl.lib | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $hal = Get-ChildItem $packages -Recurse -Filter hal.lib | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1

          if (-not $fltKernel) { throw "fltKernel.h not found in restored packages" }
          if (-not $ntdef) { throw "ntdef.h not found in restored packages" }
          if (-not $fltMgr) { throw "FltMgr.lib x64 not found in restored packages" }
          if (-not $ntoskrnl) { throw "ntoskrnl.lib x64 not found in restored packages" }
          if (-not $hal) { throw "hal.lib x64 not found in restored packages" }

          $headerDirs = Get-ChildItem $packages -Recurse -File -Filter *.h |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique
          $includePath = (@($msvcInclude) + @($headerDirs)) -join ';'

          "cl=$($cl.FullName)" >> $env:GITHUB_OUTPUT
          "link=$link" >> $env:GITHUB_OUTPUT
          "include=$includePath" >> $env:GITHUB_OUTPUT
          "fltmgr=$($fltMgr.FullName)" >> $env:GITHUB_OUTPUT
          "ntoskrnl=$($ntoskrnl.FullName)" >> $env:GITHUB_OUTPUT
          "hal=$($hal.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compile x64 minifilter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drivers\minifilter\bin\Release | Out-Null
          $env:INCLUDE = '${{ steps.tools.outputs.include }}'
          Write-Host "Using CL: ${{ steps.tools.outputs.cl }}"
          Write-Host "INCLUDE length: $($env:INCLUDE.Length)"

          & '${{ steps.tools.outputs.cl }}' `
            /nologo /c /TC /kernel /Oi /GS- /Zl /W4 /WX- `
            /D_AMD64_ /DAMD64 /D_WIN64 /DWIN64 /DNTDDI_VERSION=0x0A00000C `
            /Fo:drivers\minifilter\bin\Release\BDFRSentinelFilter.obj `
            drivers\minifilter\BDFRSentinelFilter.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Link x64 minifilter
        shell: pwsh
        run: |
          & '${{ steps.tools.outputs.link }}' `
            /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /NODEFAULTLIB `
            /INCREMENTAL:NO /OPT:REF /OPT:ICF `
            /OUT:drivers\minifilter\bin\Release\BDFRSentinelFilter.sys `
            drivers\minifilter\bin\Release\BDFRSentinelFilter.obj `
            '${{ steps.tools.outputs.ntoskrnl }}' `
            '${{ steps.tools.outputs.hal }}' `
            '${{ steps.tools.outputs.fltmgr }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package driver
        shell: pwsh
        run: |
          $sys = Resolve-Path drivers\minifilter\bin\Release\BDFRSentinelFilter.sys
          Write-Host "Driver built: $sys"
          New-Item -ItemType Directory -Force driver-dist | Out-Null
          Copy-Item $sys driver-dist\BDFRSentinelFilter.sys
          Copy-Item drivers\minifilter\BDFRSentinelFilter.inf driver-dist\BDFRSentinelFilter.inf
          Copy-Item drivers\minifilter\README.md driver-dist\README.md
          Compress-Archive driver-dist\* BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Minifilter-x64-UNSIGNED
          path: BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip
          if-no-files-found: error

      - name: Publish unsigned driver test build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-builds | Out-Null
          Copy-Item BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-builds\BDFR-Sentinel-Minifilter-x64-UNSIGNED.zip

          if (git diff --cached --quiet) {
            Write-Host "No driver test build changes to publish."
            exit 0
          }

          git commit -m "Publish latest unsigned minifilter test build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main