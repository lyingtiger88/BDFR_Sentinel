name: Minifilter Driver CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "drivers/minifilter/**"
      - ".github/workflows/driver-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "drivers/minifilter/**"
      - ".github/workflows/driver-ci.yml"

jobs:
  build-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK and SDK packages
        shell: pwsh
        run: |
          nuget restore drivers\minifilter\packages.config `
            -PackagesDirectory drivers\minifilter\packages `
            -NonInteractive

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) {
            throw "Visual Studio with MSBuild not found"
          }

          $path = Join-Path $install "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $path)) {
            throw "MSBuild.exe not found at $path"
          }

          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build minifilter
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" `
            drivers\minifilter\BDFRSentinelFilter.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Verify driver outputs
        shell: pwsh
        run: |
          $sys = Get-ChildItem drivers\minifilter -Filter BDFRSentinelFilter.sys -Recurse | Select-Object -First 1
          if (-not $sys) {
            throw "BDFRSentinelFilter.sys was not produced"
          }

          Write-Host "Driver: $($sys.FullName)"
          New-Item -ItemType Directory -Force -Path driver-artifact | Out-Null
          Copy-Item $sys.FullName driver-artifact\BDFRSentinelFilter.sys
          Copy-Item drivers\minifilter\BDFRSentinelFilter.inf driver-artifact\BDFRSentinelFilter.inf
          Copy-Item drivers\minifilter\README.md driver-artifact\README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BDFR-Sentinel-Minifilter-Unsigned
          path: driver-artifact
          if-no-files-found: error