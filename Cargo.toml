[workspace]
resolver = "2"
members = [
    "crates/sentinel-core",
    "crates/sentinel-realtime",
    "crates/sentinel-quarantine",
    "crates/sentinel-updater",
    "crates/sentinel-yara",
    "crates/sentinel-pe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["BDFR"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
notify = "8.2.0"
