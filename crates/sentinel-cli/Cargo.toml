[package]
name = "bdfr-sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "BDFR Sentinel command-line endpoint security scanner"

[[bin]]
name = "bdfr-sentinel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
walkdir.workspace = true
serde_json.workspace = true
uuid.workspace = true
sentinel-core = { path = "../sentinel-core" }
sentinel-definitions = { path = "../sentinel-definitions" }
sentinel-pe = { path = "../sentinel-pe" }
sentinel-quarantine = { path = "../sentinel-quarantine" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
